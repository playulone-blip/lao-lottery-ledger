<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>สมุดผลหวยลาว</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600&display=swap">
<style>
:root {
  --bg: #EDF0F7;
  --surface: #FFFFFF;
  --surface2: #F4F6FB;
  --ink: #0D1630;
  --ink2: #444E69;
  --muted: #747D97;
  --line: #DADFEB;
  --line2: #BFC7DA;
  --accent: #C8102E;
  --accent-ink: #FFFFFF;
  --bar: #2A78D6;
  --blue-soft: #E1EBFB;
  --heat-lo: #E4EEFC;
  --heat-hi: #0D366B;
  --cell-ink: #0D1630;
  --cell-ink-hi: #FFFFFF;
  --div-neg: #2A78D6;
  --div-mid: #EEF0F4;
  --div-pos: #D03B3B;
  --ok: #0A7A3E;
  --warn: #8F5B00;
  --warn-bg: #FFF1D6;
  --ok-bg: #DDF3E6;
  --f-display: 'Prompt', 'Noto Sans Thai', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans Thai', 'Noto Sans Thai', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0F1F; --surface: #111A31; --surface2: #17213B; --ink: #EAEEF8; --ink2: #B4BDD4; --muted: #8792B0;
    --line: #243050; --line2: #34416A; --accent: #FF5B6E; --accent-ink: #1B0509; --bar: #3987E5; --blue-soft: #16284C;
    --heat-lo: #14254A; --heat-hi: #9EC5F4; --cell-ink: #DCE6F8; --cell-ink-hi: #0A1226;
    --div-neg: #3987E5; --div-mid: #2B3350; --div-pos: #E66767;
    --ok: #3DD28D; --warn: #F0B44C; --warn-bg: #3A2C10; --ok-bg: #12301F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0F1F; --surface: #111A31; --surface2: #17213B; --ink: #EAEEF8; --ink2: #B4BDD4; --muted: #8792B0;
  --line: #243050; --line2: #34416A; --accent: #FF5B6E; --accent-ink: #1B0509; --bar: #3987E5; --blue-soft: #16284C;
  --heat-lo: #14254A; --heat-hi: #9EC5F4; --cell-ink: #DCE6F8; --cell-ink-hi: #0A1226;
  --div-neg: #3987E5; --div-mid: #2B3350; --div-pos: #E66767;
  --ok: #3DD28D; --warn: #F0B44C; --warn-bg: #3A2C10; --ok-bg: #12301F; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.6 var(--f-body); padding-block: 0 56px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 30; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -0.005em; }
h2 { font-size: 18px; line-height: 1.3; }
h3 { font-size: 15px; line-height: 1.35; }
p { margin: 0; }
button { font-family: inherit; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1120px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 4px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand svg { flex: none; color: var(--accent); }
.brand h1 { font-size: 20px; line-height: 1.2; }
.brand p { font-size: 12.5px; color: var(--muted); line-height: 1.3; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--ink2); padding: 5px 11px; font: 500 13px var(--f-body); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; color: var(--ink2); padding: 10px 14px; font: 500 14px var(--f-body); border-bottom: 2px solid transparent; white-space: nowrap; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

main { padding-block: 20px 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.view { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; }
.view[hidden] { display: none; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.card > h2, .card > h3 { margin-bottom: 4px; }
.card .sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.bar-row { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; }
.lbl { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; font-weight: 500; }
.banner { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; background: var(--warn-bg); color: var(--ink); border: 1px solid var(--line2); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
.banner[hidden] { display: none; }

.chip { border: 1px solid var(--line2); background: transparent; color: var(--ink2); border-radius: 999px; padding: 4px 12px; font: 500 13px var(--f-body); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { background: var(--ink); color: var(--bg); border: 0; border-radius: 8px; padding: 9px 16px; font: 600 14px var(--f-body); cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line2); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn[disabled] { opacity: 0.55; cursor: default; }
input, select, textarea { font: inherit; background: var(--surface); color: var(--ink); border: 1px solid var(--line2); border-radius: 8px; padding: 8px 10px; min-width: 0; max-width: 100%; }
textarea { width: 100%; font-family: var(--f-mono); font-size: 13px; line-height: 1.5; resize: vertical; }
label.f { display: grid; gap: 4px; font-size: 13px; color: var(--ink2); }
.pill { display: inline-flex; gap: 5px; align-items: center; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }

.ticket { position: relative; overflow: hidden; display: grid; grid-template-columns: 168px minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.stub { padding: 18px 16px; border-right: 2px dashed var(--line2); display: grid; align-content: space-between; gap: 14px; }
.stub .dt { font-family: var(--f-display); font-weight: 600; font-size: 22px; line-height: 1.2; }
.stub .wd { color: var(--ink2); font-size: 14px; }
.ticket::before, .ticket::after { content: ""; position: absolute; left: 160px; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); }
.ticket::before { top: -9px; }
.ticket::after { bottom: -9px; }
.tbody { padding: 18px 20px 16px; display: grid; gap: 10px; min-width: 0; }
.digits, .brks { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 6px; max-width: 520px; }
.dg { aspect-ratio: 3 / 4; max-height: 84px; display: grid; place-items: center; border: 1px solid var(--line2); border-radius: 8px; font: 600 clamp(26px, 7vw, 44px) var(--f-mono); background: var(--surface2); }
.dg.hit { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.brk { border-top: 2px solid var(--line2); display: flex; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--ink2); padding-top: 3px; min-width: 0; }
.brk.b2 { border-top-color: var(--accent); color: var(--ink); }
.brk b { font-weight: 600; }
.nextline { font-size: 13px; color: var(--muted); }
@media (max-width: 620px) {
  .ticket { grid-template-columns: minmax(0, 1fr); }
  .stub { border-right: 0; border-bottom: 2px dashed var(--line2); grid-auto-flow: column; align-items: end; justify-content: space-between; }
  .ticket::before, .ticket::after { display: none; }
}

.tw { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
.tbl th { text-align: right; font-size: 12px; font-weight: 500; color: var(--muted); padding: 6px 10px; white-space: nowrap; border-bottom: 1px solid var(--line2); }
.tbl td { text-align: right; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl tr.sel td { background: var(--blue-soft); }
.tbl .num { font-family: var(--f-mono); }
.tbl td .lastTwo, .lastTwo { color: var(--accent); font-weight: 600; }
.ybtn { border: 0; background: none; color: var(--ink); font: 600 14px var(--f-body); cursor: pointer; padding: 0; text-decoration: underline; text-decoration-color: var(--line2); text-underline-offset: 3px; }

.bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
.bars li { display: grid; grid-template-columns: 44px minmax(0, 1fr) 54px; gap: 8px; align-items: center; font-size: 13px; }
.bars .bt { position: relative; height: 14px; background: var(--surface2); border-radius: 0 3px 3px 0; }
.bars .bt i { display: block; height: 100%; background: var(--bar); border-radius: 0 3px 3px 0; }
.bars .ex { position: absolute; top: -3px; bottom: -3px; border-left: 2px dashed var(--ink); }
.bars .bv { text-align: right; }
.cols { display: flex; gap: 4px; align-items: flex-end; }
.col { flex: 1 1 0; min-width: 0; display: grid; gap: 4px; justify-items: center; font-size: 11px; color: var(--muted); }
.cb { position: relative; width: 100%; height: 120px; }
.cb i { position: absolute; left: 12%; right: 12%; bottom: 0; background: var(--bar); border-radius: 3px 3px 0 0; }
.cb b { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--ink); }
.cb u { position: absolute; left: 0; right: 0; text-align: center; text-decoration: none; font-size: 11px; color: var(--ink2); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); margin-top: 10px; align-items: center; }
.legend .dash { display: inline-block; width: 18px; border-top: 2px dashed var(--ink); margin-right: 5px; vertical-align: middle; }
.legend .sw { display: inline-block; width: 18px; height: 8px; background: var(--bar); margin-right: 5px; vertical-align: middle; border-radius: 2px; }

.hgrid { display: grid; grid-template-columns: 22px repeat(var(--cols), minmax(0, 1fr)); gap: 3px; max-width: 640px; }
.hh { font-size: 11px; color: var(--muted); display: grid; place-items: center; min-height: 18px; }
.hc { min-height: 38px; padding: 2px; display: grid; place-items: center; align-content: center; line-height: 1.15; border-radius: 4px; color: var(--cell-ink); text-align: center; background: var(--heat-lo); }
.hc b { font: 600 clamp(10px, 2.6vw, 12px) var(--f-mono); }
.hc span { font: 500 clamp(9px, 2.3vw, 11px) var(--f-mono); opacity: 0.9; }
.hc[data-hi="1"] { color: var(--cell-ink-hi); }
.hc.seq { background: color-mix(in oklab, var(--heat-hi) calc(var(--t) * 100%), var(--heat-lo)); }
.hc.pos { background: color-mix(in oklab, var(--div-pos) calc(var(--a) * 100%), var(--div-mid)); }
.hc.neg { background: color-mix(in oklab, var(--div-neg) calc(var(--a) * 100%), var(--div-mid)); }
.hc.out { outline: 2px solid var(--accent); outline-offset: 1px; }
.hgrid.wide .hc { min-height: 44px; }
.hlegend { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 12px; flex-wrap: wrap; }
.hlegend i { display: block; width: 140px; max-width: 40vw; height: 10px; border-radius: 3px; }
.hlegend i.seq { background: linear-gradient(to right in oklab, var(--heat-lo), var(--heat-hi)); }
.hlegend i.dv { background: linear-gradient(to right in oklab, var(--div-neg), var(--div-mid), var(--div-pos)); }

.ctrl { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; align-items: end; }
.prog { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .prog i { transition: width 0.15s linear; } }
.verdict { border-left: 3px solid var(--line2); padding: 2px 0 2px 12px; display: grid; gap: 4px; }
.verdict.flag { border-left-color: var(--accent); }
.howto { font-size: 13px; color: var(--ink2); display: grid; gap: 4px; }
.empty { color: var(--muted); text-align: center; padding: 28px 16px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 14px 24px; margin: 0; }
.facts dt { font-size: 12px; color: var(--muted); }
.facts dd { margin: 0; font-size: 15px; }
.facts dd b { font: 600 20px var(--f-mono); }
#tip { position: fixed; z-index: 60; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12.5px; line-height: 1.4; padding: 6px 9px; border-radius: 6px; max-width: 260px; }
#tip[hidden] { display: none; }
.msg { font-size: 13px; min-height: 1.4em; }
.msg.err { color: var(--accent); }
.foot { font-size: 12.5px; color: var(--muted); padding-block: 8px 0; }
</style>

  <div class="wrap">
    <div class="top-in">
      <div class="brand">
        <svg width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true"><path d="M3 9a3 3 0 0 1 3-3h22a3 3 0 0 1 3 3v3.2a3.8 3.8 0 0 0 0 7.6V23a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-3.2a3.8 3.8 0 0 0 0-7.6V9Z" stroke="currentColor" stroke-width="2"/><path d="M22 7v18" stroke="currentColor" stroke-width="2" stroke-dasharray="2.5 3"/><path d="M8 13h8M8 17h6M8 21h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>

<script>
var TH_MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
var TH_DAYS = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];

function pad(n, w) { return String(n).padStart(w, '0'); }
function isoOf(y, m, d) { return y + '-' + pad(m, 2) + '-' + pad(d, 2); }
function validDate(y, m, d) {
  if (y < 1900 || y > 2200) return false;
  var dt = new Date(y, m - 1, d);
  return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
}
function weekdayOf(iso) {
  var p = iso.split('-');
  return new Date(+p[0], +p[1] - 1, +p[2]).getDay();
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function nowMs() { return typeof performance !== 'undefined' ? performance.now() : Date.now(); }

function makeSample() {
  var rng = mulberry32(20261022), out = {};
  var dt = new Date(2022, 0, 3), end = new Date(2026, 9, 21);
  while (dt <= end) {
    var w = dt.getDay();
    if (w >= 1 && w <= 5) {
      var s = '';
      for (var i = 0; i < 6; i++) s += Math.floor(rng() * 10);
      out[isoOf(dt.getFullYear(), dt.getMonth() + 1, dt.getDate())] = s;
    }
    dt.setDate(dt.getDate() + 1);
  }
  return out;
}

function toDraws(map) {
  return Object.keys(map).sort().map(function (d) {
    var p = d.split('-');
    return { d: d, n: map[d], y: +p[0], m: +p[1], w: weekdayOf(d) };
  });
}

function parseLines(text) {
  var items = [], bad = [];
  text.split(/\r?\n/).forEach(function (ln, i) {
    var s = ln.trim();
    if (!s) return;
    var y, m, d, rest, mm = s.match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
    if (mm) { y = +mm[1]; m = +mm[2]; d = +mm[3]; rest = s.replace(mm[0], ' '); }
    else {
      mm = s.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);
      if (mm) { d = +mm[1]; m = +mm[2]; y = +mm[3]; rest = s.replace(mm[0], ' '); }
    }
    if (!mm) { bad.push(i + 1); return; }
    if (y > 2400) y -= 543;
    if (!validDate(y, m, d)) { bad.push(i + 1); return; }
    
    // รองรับการนำเข้าผลที่มีช่องว่าง ขีดคั่น หรือคอมมา (เช่น 487-658 หรือ 487 658)
    var cleanRest = rest.replace(/[-\s,]+/g, '');
    var nm = cleanRest.match(/(\d{2,6})/);
    if (!nm) { bad.push(i + 1); return; }
    items.push({ d: isoOf(y, m, d), n: nm[1] });
  });
  return { items: items, bad: bad };
}

function lastN(s, n) { return s.length >= n ? s.slice(s.length - n) : null; }
function seriesVals(draws, n) {
  var out = [];
  for (var i = 0; i < draws.length; i++) {
    var s = lastN(draws[i].n, n);
    if (s !== null) out.push(parseInt(s, 10));
  }
  return Int32Array.from(out);
}
function countVals(vals, K) {
  var c = new Uint32Array(K);
  for (var i = 0; i < vals.length; i++) c[vals[i]]++;
  return c;
}
function gapsOf(vals, K) {
