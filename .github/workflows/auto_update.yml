name: Auto Update Lao Lottery

on:
  schedule:
    # ตั้งเวลารันทุกวัน จันทร์ พุธ ศุกร์ เวลา 20:30 น. ตามเวลาไทย (UTC 13:30)
    - cron: '30 13 * * 1,3,5'
  workflow_dispatch: # อนุญาตให้กดปุ่มสั่งรันด้วยมือจากหน้าเว็บ GitHub ได้ทันที

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pandas

      - name: Run script
        run: python update_lottery.py

      - name: Commit and push changes if any
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Auto-update lottery data [skip ci]"
          git push
